spring.application.name=NetPulse

# Localhost-only by default until authentication exists.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${NETPULSE_DB_URL}
spring.datasource.username=${NETPULSE_DB_USER}
spring.datasource.password=${NETPULSE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Migrations are applied manually (see db/migrations/).
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

netpulse.security.mode=UNAUTHENTICATED_LOCALHOST_ONLY

aws.region=${AWS_REGION:}
netpulse.sqs.queue-url=${NETPULSE_SQS_QUEUE_URL:}

netpulse.scheduler.enabled=${NETPULSE_SCHEDULER_ENABLED:false}
netpulse.scheduler.fixed-delay-ms=${NETPULSE_SCHEDULER_FIXED_DELAY_MS:10000}
netpulse.scheduler.batch-size=${NETPULSE_SCHEDULER_BATCH_SIZE:50}
netpulse.scheduler.publish-lease-seconds=${NETPULSE_SCHEDULER_PUBLISH_LEASE_SECONDS:60}
