spring.application.name=NetPulse

# Local default: loopback. Render/containers must set SERVER_ADDRESS=0.0.0.0.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Prefer Render's PORT; fall back to SERVER_PORT, then 8080 for local runs.
server.port=${PORT:${SERVER_PORT:8080}}

# Honor X-Forwarded-* from Render's HTTPS proxy (Secure cookies, redirects).
server.forward-headers-strategy=framework

spring.datasource.url=${NETPULSE_DB_URL}
spring.datasource.username=${NETPULSE_DB_USER}
spring.datasource.password=${NETPULSE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Migrations are applied manually (see db/migrations/).
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
management.health.db.enabled=true

# UNAUTHENTICATED_LOCALHOST_ONLY | HEALTH_ONLY | AUTHENTICATED
netpulse.security.mode=${NETPULSE_SECURITY_MODE:UNAUTHENTICATED_LOCALHOST_ONLY}

# Single-admin credentials (AUTHENTICATED mode). Password must be a BCrypt hash — never plaintext.
netpulse.admin.username=${NETPULSE_ADMIN_USERNAME:}
netpulse.admin.password-hash=${NETPULSE_ADMIN_PASSWORD_HASH:}

# Comma-separated browser origins allowed for credentialed CORS (AUTHENTICATED mode).
netpulse.cors.allowed-origins=${NETPULSE_CORS_ALLOWED_ORIGINS:}

# Session cookie (AUTHENTICATED). Use SameSite=None + Secure=true only for true cross-site frontends.
netpulse.session.cookie-same-site=${NETPULSE_SESSION_COOKIE_SAME_SITE:Lax}
netpulse.session.cookie-secure=${NETPULSE_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=NETPULSE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${NETPULSE_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${NETPULSE_SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.timeout=${NETPULSE_SESSION_TIMEOUT:30m}

netpulse.auth.login-max-attempts=${NETPULSE_LOGIN_MAX_ATTEMPTS:5}
netpulse.auth.login-window-seconds=${NETPULSE_LOGIN_WINDOW_SECONDS:60}

aws.region=${AWS_REGION:}
netpulse.sqs.queue-url=${NETPULSE_SQS_QUEUE_URL:}

netpulse.scheduler.enabled=${NETPULSE_SCHEDULER_ENABLED:false}
netpulse.scheduler.fixed-delay-ms=${NETPULSE_SCHEDULER_FIXED_DELAY_MS:10000}
netpulse.scheduler.batch-size=${NETPULSE_SCHEDULER_BATCH_SIZE:50}
netpulse.scheduler.publish-lease-seconds=${NETPULSE_SCHEDULER_PUBLISH_LEASE_SECONDS:60}
